  <path d="M 70 86 Q 78 78 86 86" fill="none" stroke="#223018" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 112 86 Q 120 78 128 86" fill="none" stroke="#223018" stroke-width="4.5" stroke-linecap="round"/>
  <!-- soft expression lines -->
  <path d="M 64 98 Q 62 96 60 97" fill="none" stroke="#6b5636" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M 136 98 Q 138 96 140 97" fill="none" stroke="#6b5636" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <!-- calm smile -->
