      <stop offset="0%" stop-color="#7fa052"/>
      <stop offset="100%" stop-color="#4c6632"/>
    </radialGradient>
    <linearGradient id="leafg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93ab68"/>
      <stop offset="100%" stop-color="#5a7340"/>
    </linearGradient>
  </defs>
  <!-- leaf -->
  <ellipse cx="150" cy="42" rx="33" ry="15" fill="url(#leafg)" transform="rotate(-28 150 42)"/>
  <line x1="150" y1="42" x2="124" y2="58" stroke="#33461f" stroke-width="1.5" stroke-linecap="round"/>
  <!-- stem -->
  <rect x="96" y="35" width="8" height="24" rx="4" fill="#6b5a33"/>
  <!-- body -->
  <ellipse cx="100" cy="103" rx="60" ry="74" fill="url(#skin)"/>
  <ellipse cx="84" cy="128" rx="24" ry="32" fill="#ffffff14"/>
